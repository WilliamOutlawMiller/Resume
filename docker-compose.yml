services:
  williammiller-site:
    image: williammiller-site:latest
    container_name: williammiller-site
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - PORT=80
    volumes:
      - dataprotection-keys:/root/.aspnet/DataProtection-Keys
    networks:
      - web-network

volumes:
  dataprotection-keys:

networks:
  web-network:
    driver: bridge

