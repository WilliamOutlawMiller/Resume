name: Build and Deploy

on:
  push:
    branches:
      - prod
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'prod'

env:
  DOCKER_IMAGE: williammiller-site
  DOCKER_TAG: latest
  APP_DIR: /opt/williammiller-site

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          set -e
          
          echo "=== Starting Deployment ==="
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo ""
          
          cd ${{ env.APP_DIR }}
          
          echo "Step 1: Pulling latest code from GitHub..."
          REPO_URL="https://github.com/${{ github.repository }}.git"
          if [ -n "${{ secrets.GITHUB_PAT }}" ]; then
            REPO_URL="https://${{ secrets.GITHUB_PAT }}@github.com/${{ github.repository }}.git"
          fi
          
          if [ -d ".git" ]; then
            git remote set-url origin $REPO_URL || true
            git fetch origin
            git reset --hard origin/prod
            git clean -fd
          else
            echo "Repository not found. Cloning..."
            git clone $REPO_URL .
            git checkout prod
          fi
          
          echo "Step 2: Building Docker image..."
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} .
          
          if [ $? -ne 0 ]; then
            echo "ERROR: Docker build failed"
            exit 1
          fi
          
          echo "Step 3: Stopping existing container..."
          docker stop williammiller-site 2>/dev/null || true
          docker rm williammiller-site 2>/dev/null || true
          
          echo "Step 4: Starting new container..."
          if [ -f "docker-compose.yml" ]; then
            docker compose down 2>/dev/null || true
            docker compose up -d
          else
            docker run -d \
              --name williammiller-site \
              --restart unless-stopped \
              -p 8080:80 \
              -e ASPNETCORE_ENVIRONMENT=Production \
              -e ASPNETCORE_URLS=http://+:80 \
              -e PORT=80 \
              ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          fi
          
          echo "Step 5: Verifying deployment..."
          sleep 5
          
          if docker ps | grep -q williammiller-site; then
            echo "SUCCESS: Container is running"
            echo ""
            echo "Container status:"
            docker ps | grep williammiller-site
            echo ""
            echo "Recent logs:"
            docker logs --tail 20 williammiller-site
          else
            echo "ERROR: Container is not running"
            echo ""
            echo "Container logs:"
            docker logs williammiller-site || true
            exit 1
          fi
          
          echo ""
          echo "=== Deployment Complete ==="

